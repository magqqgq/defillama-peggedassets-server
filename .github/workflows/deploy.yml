name: Deploy

on:
  push:
    branches: [ master ]
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Least privilege: this job only needs to read the repo and run the deploy
    # script. An explicit `permissions` block prevents the default GITHUB_TOKEN
    # from carrying write scopes it never uses.
    permissions:
      contents: read
    steps:
    # Pinned to a full commit SHA. A mutable tag (v2) can be re-pointed at
    # arbitrary code by the upstream publisher, which would execute inside this
    # job that holds AWS credentials.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Get Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        # Node 16 reached end-of-life on 2023-09-11 and no longer receives
        # security patches. Node 20 is the current LTS line.
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - name: Deploy infrastructure stack
      run: npm run deploy:dev
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        OUTDATED_WEBHOOK: ${{ secrets.OUTDATED_WEBHOOK }}
